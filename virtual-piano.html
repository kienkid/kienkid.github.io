                <h2><img id="stuff-img" src="Image/favicon3.webp" alt="My Profile Picture"> Virtual Piano</h2>
            </div>
            <div class="piano-controls">
            <div class="control">
                <label for="volume">Volume</label>
                <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
            </div>

            <div class="control">
                <label for="tempo">Tempo <span id="tempoVal">120</span> BPM</label>
                <input id="tempo" type="range" min="40" max="240" step="1" value="120" />
            </div>

            <div class="control-buttons">
                <button id="metronomeToggle" aria-pressed="false" title="Toggle metronome">Metronome: Off</button>
                <button id="sustainToggle" aria-pressed="false" title="Toggle sustain">Sustain: Off</button>
            </div>
            </div>

            <div class="piano-wrap">
                <div class="first-3-key" aria-label="Virtual piano" role="application">
                    <div class="first-3-key-detail">     
                            <div class="key white a" id="A0"></div>
                            <div class="key black a_sharp" id="A#0"></div>
                            <div class="key white b" id="B0"></div>
                    </div>  
                </div>
