# =============================================================================
# Update gold data – daily APPEND of new days to gold-tracker/data/*.json
# History from 11 Jun 2026 is frozen: existing days are never overwritten.
# Location in repo: <username>.github.io/.github/workflows/update-data.yml
# =============================================================================
name: Update gold data

on:
  schedule:
    # 14:00 UTC = 21:00 Hanoi (GMT+7) – after DOJI's last price change of the day.
    # GitHub may delay scheduled runs by several minutes under load.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "append = add today + missed days (normal) · seed = one-time initial load from 11 Jun 2026"
        type: choice
        options: [append, seed]
        default: append
      force:
        description: "Allow seed when data already exists (still only ADDS missing days)"
        type: boolean
        default: false

permissions:
  contents: write          # needed to push the updated JSON files

concurrency:
  group: update-gold-data  # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gold-tracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # built-in fetch, no npm install needed

      - name: Fetch new data and append to JSON
        env:
          TZ: Asia/Ho_Chi_Minh
          MODE: ${{ github.event.inputs.mode || 'append' }}   # scheduled runs = append
          FORCE: ${{ github.event.inputs.force || 'false' }}
          CATCHUP_DAYS: "31"
          XAU_FALLBACK: "yahoo"
        run: node scripts/fetch-data.mjs

      - name: Validate JSON files
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes – nothing to commit."
            exit 0
          fi
          git commit -m "data: ${MODE:-append} gold prices $(date +'%Y-%m-%d %H:%M') (GMT+7)"
          # Retry push in case another commit landed meanwhile
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1
        env:
          MODE: ${{ github.event.inputs.mode || 'append' }}
